<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>소프트웨어 기술 선호에 관한 설문</title>
    <link rel="stylesheet" href="survey5.css">
</head>
<body>
    <header>
        <h1>설문지</h1>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
    </header>

    <section>
        <form action="">
            <label>학년
                <input type="radio" name="year" value="1" checked>1학년
                <input type="radio" name="year" value="2">2학년
                <input type="radio" name="year" value="3">3학년
                <input type="radio" name="year" value="4">4학년
            </label><br><br>
            
            <label>성별
                <input type="radio" name="gender" value="male">남
                <input type="radio" name="gender" value="female">여
            </label><br><br>
            
            <label>관심 분야
                <select name="interest">
                    <option value="mobile" selected>모바일 소프트웨어</option>
                    <option value="web">웹 프로그래밍</option>
                </select>
            </label><br><br>
            
            <label>진로
                <input type="checkbox" name="career" value="dev" checked>개발
                <input type="checkbox" name="career" value="plan">기획
                <input type="checkbox" name="career" value="sales">영업
                <input type="checkbox" name="career" value="startup">창업
            </label><br><br>
            
            <label>남기고 싶은 말<br>
                <textarea name="comment" rows="5" cols="40" placeholder="글을 남겨주세요"></textarea>
            </label>
        </form>
    </section>

    <footer>
        Copyright 2022 by Kitae
    </footer>
</body>
</html>
