<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>계산기 만들기</title>
<style>
    table { border: none; text-align: center; }
    input[type="text"] { width: 100%; text-align: left; padding: 3px; box-sizing: border-box; }
    td { width: 60px; height: 30px; }
    button { width: 100%; height: 100%; }
</style>
<script>
    let display;
    window.onload = function() {
        display = document.getElementById("display");
    };

    function add(char) {
        if(display.value === "0") {
            display.value = char;
        } else {
            display.value += char;
        }
    }

    function calc() {
        try {
            display.value = eval(display.value);
        } catch(e) {
            display.value = "Error";
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function back() {
        display.value = display.value.slice(0, -1);
        if(display.value === "") {
            display.value = "0";
        }
    }
</script>
</head>
<body>
<h3>계산기 만들기</h3>
<hr>
<table border="0">
    <tr>
        <td colspan="4"><input type="text" id="display" value="0" readonly></td>
    </tr>
    <tr>
        <td><button onclick="back()">BACK</button></td>
        <td><button onclick="clearDisplay()">CE</button></td>
        <td><button onclick="clearDisplay()">C</button></td>
        <td><button onclick="calc()">=</button></td>
    </tr>
    <tr>
        <td><button onclick="add('7')">7</button></td>
        <td><button onclick="add('8')">8</button></td>
        <td><button onclick="add('9')">9</button></td>
        <td><button onclick="add('/')">/</button></td>
    </tr>
    <tr>
        <td><button onclick="add('4')">4</button></td>
        <td><button onclick="add('5')">5</button></td>
        <td><button onclick="add('6')">6</button></td>
        <td><button onclick="add('*')">*</button></td>
    </tr>
    <tr>
        <td><button onclick="add('1')">1</button></td>
        <td><button onclick="add('2')">2</button></td>
        <td><button onclick="add('3')">3</button></td>
        <td><button onclick="add('-')">-</button></td>
    </tr>
    <tr>
        <td><button onclick="add('0')">0</button></td>
        <td><button onclick="add('+')">+</button></td>
        <td><button>NONE</button></td>
        <td><button>NONE</button></td>
    </tr>
</table>
</body>
</html>
