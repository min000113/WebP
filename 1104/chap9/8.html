<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>아이템을 클릭하면 1.3배 크기로</title>
<script>
    window.onload = function() {
        let listItems = document.getElementsByTagName("li");
        for(let i = 0; i < listItems.length; i++) {
            listItems[i].onclick = function(e) {
                // 먼저 모든 li 태그의 크기를 1em으로 초기화
                for(let j = 0; j < listItems.length; j++) {
                    listItems[j].style.fontSize = "1em";
                }
                // 클릭된 대상만 1.3배로 설정
                e.target.style.fontSize = "1.3em";
            };
        }
    }
</script>
</head>
<body>
<h3>아이템을 클릭하면 1.3배 크기로</h3>
<hr>
<p>여름 방학 때 하고 싶은 것들</p>
<ul>
    <li>자전거로 대한민국 일주</li>
    <li>책 100권 읽기</li>
    <li>철인 3종 경기 준비</li>
    <li>자바스크립트 정복</li>
</ul>
</body>
</html>
