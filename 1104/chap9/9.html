<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>아이템에 마우스를 올리면 설명 출력</title>
<style>
    #descDiv {
        position: absolute;
        border: 1px solid black;
        background-color: yellowgreen;
        padding: 5px;
        visibility: hidden;
    }
</style>
<script>
    let descriptions = [
        "자전거를 타고 전국 일주를 목표로 합니다.",
        "빨간자전거를 타고 서울, 대전, 대구, 부산 찍고, 목포, 정인천을 거쳐 달린다",
        "수영, 사이클, 마라톤으로 강인한 체력을 기릅니다.",
        "웹 프로그래밍의 핵심인 자바스크립트를 완벽 마스터합니다."
    ];

    function showDesc(e, index) {
        let descDiv = document.getElementById("descDiv");
        descDiv.innerHTML = descriptions[index];
        descDiv.style.left = e.clientX + 15 + "px";
        descDiv.style.top = e.clientY + 15 + "px";
        descDiv.style.visibility = "visible";
    }

    function hideDesc() {
        document.getElementById("descDiv").style.visibility = "hidden";
    }
</script>
</head>
<body>
<h3>아이템에 마우스를 올리면 설명 출력</h3>
<hr>
<p>여름 방학 때 하고 싶은 것들</p>
<ul>
    <li onmouseover="showDesc(event, 0)" onmouseout="hideDesc()">자전거로 대한민국 일주</li>
    <li onmouseover="showDesc(event, 1)" onmouseout="hideDesc()">책 100권 읽기</li>
    <li onmouseover="showDesc(event, 2)" onmouseout="hideDesc()">철인 3종 경기 준비</li>
    <li onmouseover="showDesc(event, 3)" onmouseout="hideDesc()">자바스크립트 정복</li>
</ul>
<div id="descDiv"></div>
</body>
</html>
