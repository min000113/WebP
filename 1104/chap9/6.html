<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>마우스 휠을 이용한 이미지 확대/축소</title>
<script>
    function zoomImage(e) {
        let img = document.getElementById("targetImg");
        if (e.deltaY < 0 || e.wheelDelta > 0) {
            img.width *= 0.95;
            img.height *= 0.95;
        } else {
            img.width *= 1.05;
            img.height *= 1.05;
        }
        e.preventDefault();
    }
</script>
</head>
<body>
<h3>마우스 휠을 이용한 이미지 확대/축소</h3>
<hr>
<p>이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가 확대됩니다.</p>
<img id="targetImg" src="media/apple.png" alt="이미지" width="200" onwheel="zoomImage(event)">
</body>
</html>
