<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>이미지 커서 만들기</title>
<style>
    #customCursor { 
        position: absolute; 
        width: 30px; 
        height: 30px; 
        pointer-events: none;
    }
</style>
<script>
    document.onmousemove = function(e) {
        let cursor = document.getElementById("customCursor");
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
    };
</script>
</head>
<body>
<h3>이미지 커서 만들기</h3>
<hr>
<p>마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다</p>
<img id="customCursor" src="media/cursor.png" alt="커서">
</body>
</html>
