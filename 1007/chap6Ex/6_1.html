<!DOCTYPE html>

<body>
<script>
  // (1) big 함수 작성
  function big(a, b) {
    let num1 = parseInt(a);
    let num2 = parseInt(b);
    return (num1 > num2) ? num1 : num2;
  }
</script>
<script>
  // 작성한 big 함수를 여기서 실행합니다.
  let b = big("625", "555");
  document.write("큰수=" + b);
</script>
</body>
</html>
