<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>자바스크립트 코드 위치</title>
</head>
<body>
<h3>마우스를 올려 보세요</h3>
<hr>

<!-- 1. 기존 속성을 지우고 id를 부여합니다. -->
<div id="myDiv">
여기에 마우스를 올리면 배경색이 노란색으로 변합니다.
</div>

<!-- 2. script 태그를 만들어 이벤트를 처리합니다. -->
<script>
  let divObj = document.getElementById("myDiv");
  
  // 마우스를 올렸을 때 (onmouseover)
  divObj.onmouseover = function() {
    this.style.background = 'yellow';
  };
  
  // 마우스를 벗어났을 때 (onmouseout)
  divObj.onmouseout = function() {
    this.style.background = 'white';
  };
</script>

</body>
</html>
