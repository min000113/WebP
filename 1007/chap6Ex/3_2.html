<script>
  document.write("<h3>document.write()로 표만들기</h3>");
  document.write("<hr>");
  document.write("<table border='1' style='border-collapse:collapse;'>");
  
  // 첫 번째 행 (n)
  document.write("<tr>");
  document.write("<td>n</td>");
  for(let i = 0; i < 10; i++) {
    document.write("<td>" + i + "</td>");
  }
  document.write("</tr>");
  
  // 두 번째 행 (n의 제곱)
  document.write("<tr>");
  document.write("<td>n<sup>2</sup></td>");
  for(let i = 0; i < 10; i++) {
    document.write("<td>" + (i * i) + "</td>");
  }
  document.write("</tr>");
  
  document.write("</table>");
</script>
