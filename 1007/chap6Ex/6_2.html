<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>2</title>
</head>
<body>
<script>
  // (2) pr 함수 작성
  function pr(char, count) {
    for(let i = 0; i < count; i++) {
      document.write(char);
    }
  }
</script>
<script>
  // 작성한 pr 함수를 여기서 실행합니다.
  pr("%", 5);
</script>
</body>
</html>
