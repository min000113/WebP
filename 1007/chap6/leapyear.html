<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤년 판별</title>
</head>
<body>
  <script>
    const year = Number(prompt("년도를 입력하세요."));

    if (Number.isNaN(year) || year <= 0) {
      alert("올바른 연도를 입력하세요.");
    } else if ((year % 4 === 0 && year % 100 !== 0) || year % 400 === 0) {
      alert(`${year}년은 윤년입니다.`);
    } else {
      alert(`${year}년은 평년입니다.`);
    }
  </script>
</body>
</html>
