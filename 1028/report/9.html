<ol type="A" style="background-color:yellowgreen" onclick="addList(this)">
  <li>물을 끓인다.</li>
</ol>
<script>
  function addList(obj) {
    let text = prompt("라면을 끓이는 순서를 입력하라");
    if (text) {
      let newLi = document.createElement("li");
      newLi.innerHTML = text;
      obj.appendChild(newLi);
    }
  }
</script>
