<script>
  function addAnswer(obj, text) {
    let parent = obj.parentElement;
    if (parent.getElementsByTagName("p").length > 1) return;

    let p = document.createElement("p");
    p.innerHTML = text;
    p.onclick = function() {
      this.parentElement.removeChild(this);
    };
    parent.appendChild(p);
  }
</script>
